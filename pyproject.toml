[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "daimonion"
dynamic = ["version"]
requires-python = ">=3.11"
# The installed entry point (uvx --from git+..., pip wheel) imports copier,
# yaml, tomlkit and jinja2 through the tools/ chain at module load, so they
# must ride along as runtime dependencies; the dev group keeps its own
# copies for the repo's own tooling.
dependencies = ["copier>=9,<10", "jinja2>=3.1,<4", "pyyaml>=6.0,<7", "tomlkit>=0.13,<1"]

[project.scripts]
daimonion = "tools.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9,<1.40",
    "copier>=9,<10",
    "coverage>=7.15.4,<8",
    "deptry>=0.25.1,<0.26",
    "hypothesis>=6.130.0,<7.0",
    "jinja2>=3.1.6,<4",
    "mcp[cli]>=2.0,<3",
    "mkdocstrings[python]",
    "pip-audit>=2.9.0,<3.0",
    "pyproject-fmt>=2.27.0,<3.0",
    "pyrefly>=1.2.0,<1.3",
    "pytest>=9.1.1,<9.2",
    "pytest-cov>=7.1.0,<7.2",
    "pytest-mock>=3.14.0,<4.0",
    "pytest-randomly>=5.0,<6",
    "pytest-timeout>=2.4.0,<2.5",
    "pytest-xdist>=3.8.0,<3.9",
    "pyyaml>=6.0,<7",
    "ruff>=0.16.2,<0.17",
    "starlette>=1.6,<2",
    "tomlkit>=0.13,<1",
    "typos>=1.49.0,<1.50",
    "vulture>=2.14.0,<3.0",
    "z3-solver>=4.13.0,<5",
    "zensical",
]

[tool.setuptools]
# This repo is the copier template itself, not a library: there is no
# importable Python at the root (generation no longer needs custom Jinja
# extensions). `tools` is listed explicitly so the `daimonion`
# entry point resolves in an installed environment (tools/ is a namespace
# package: it has no __init__.py, and tests import it via the explicit
# sys.path hook in tests/test_qa.py). Nothing else is listed: flat-layout
# auto-discovery would trip over site/ (docs build output) and template/
# (the copier source tree) when editable-installing under xdist.
py-modules = []
packages = ["tools"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error.
# `-p no:randomly` keeps the installed pytest-randomly plugin inert everywhere by
# default (it reshuffles test order, which the 30s edit loop must not pay for):
# the nightly seed task (`task test-randomly`, run by ci.yml's schedule) is the
# only place that re-enables it with `-p randomly` (TODO.md §27.4: conditional
# adopt, nightly seed job only).
addopts = """
    --tb=native -vv -n auto -p no:randomly
    """
# Cost tiers. `-m "not heavy and not slow and not meta and not network"` is the
# edit loop (`task test-fast`, budget 30s: anything slower than that belongs to
# a marker below or is a regression -- the budget is mechanically enforced by
# tests/test_marker_drift.py against the ledger row's budget_seconds); `slow`
# is the serial witness batch runner (`task test-slow`); `heavy` builds venvs
# and `network` says the run needs the wire (`task test-heavy`, pre-push and
# nightly); `meta` is the cost ledger's own guard (`task test-meta`, its own
# CI job: it re-collects every tier in its own pytest sessions, which is what
# the edit loop cannot afford). fast/full are the witness render tiers from
# .github/workflows/witness.yml. The collected sets and measured costs of the
# task tiers and of the PR witness tier live in tests/matrix/tiers.json,
# checked by tests/test_marker_drift.py.
markers = [
    "heavy: builds a virtualenv (uv sync), i.e. installs dependencies",
    "network: touches the network (uv sync, uvx downloads, remote clones)",
    "fast: witness render tier -- renders the template without a venv",
    "full: witness full tier -- renders plus the expensive generated-project checks",
    "meta: the cost ledger's own guard -- it re-collects every tier, so it is not part of the edit loop",
    "slow: expensive, but neither a venv build nor network-bound (the serial 205-leaf witness batch runner)",
]
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "tests"

[tool.basedpyright]
pythonVersion = "3.11"
include = ["tests", "tools"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/typestubs",
    "**/stubs",
    "build",
    "dist",
    ".venv",
    "template",
    ".github/pages",  # zensical 移行でこのリポでは実行されない共有 CI ヘルパー
]
typeCheckingMode = "recommended"
reportMissingTypeStubs = false
reportAny = false # WHYNOT: too punishing for a template repo
reportExplicitAny = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingTypeArgument = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
reportIgnoreCommentWithoutRule = false
reportCallInDefaultInitializer = false
reportImplicitRelativeImport = false # tests はパッケージ化せず平置きのため、support / test_recommended_path からの import は暗黙相対でOK
reportImplicitStringConcatenation = false # コメントを挟んだ意図的な文字列連結は既存コードに多用

[tool.pyrefly]
python-version = "3.11"
search-path = ["tests", "tools", "."]
project-includes = ["tests", "tools"]
project-excludes = [".venv", "template", ".github/pages"]  # .github/pages はこのリポでは未実行の共有 CI ヘルパー
preset = "default"

[tool.ruff]
line-length = 120
fix = true
unsafe-fixes = false
src = ["tests"]
# template/ は生成コード。生成先プロジェクト側でチェックされる。
# .github/pages は共有の CI ヘルパー（zensical 移行後このリポでは未実行）。
# docs/ は zensical / MkDocs の散文ドキュメント（コードではない）。
# *.md は旧 pre-commit フックと同じく対象外（ruff 新版は Markdown 内の
# Python コードブロックを format するが、例示コードは意図通りに残す）。
extend-exclude = ["template", ".github/pages", "docs", "*.md"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-ignore = [
    "D10",     # undocumented-code  WHYNOT: not a concern in this repo.
    "DOC",     # pydoclint  WHYNOT: form over substance.
    "PLR2004", # magic-value-comparison  WHYNOT: a constant would just restate the literal.
    "PLR6301", # no-self-use  WHYNOT: self-free methods still override.
    "T20",     # flake8-print  WHYNOT: print is the fastest debugger.
    "TD",      # flake8-todos  WHYNOT: task-tags below replace it.
    "FIX",     # flake8-fixme  WHYNOT: same as TD.
    "TRY002",  # raise-vanilla-class  WHYNOT: exception taxonomy is ceremony until something catches it.
    "TRY003",  # raise-vanilla-args  WHYNOT: the message lives at the raise site.
    "COM812",  # missing-trailing-comma  WHYNOT: fights the formatter.
    "TC",      # flake8-type-checking  WHYNOT: import cost isn't a concern.
    "ISC001",  # single-line-implicit-str-concat  WHYNOT: same as COM812.
    "CPY001",  # missing-copyright-notice  WHYNOT: not a library.
    "SIM401",  # if-else-block-instead-of-dict-get  WHYNOT: unsafe-fix が dict 前提で .get() に変換し、
    "S101",    # assert-used  WHYNOT: 型絞り込み assert。python -O で消えても実害なし。
    "PT018",   # pytest-composite-assertion  WHYNOT: 型絞り込みの隣接 assert を分割したくない。
    "RUF100",  # unused-noqa  WHYNOT: S310 のように式をまたぐ検出は noqa を unused と誤判定し、--fix が必要な noqa まで消す。
    "RUF105",  # noqa-comments  WHYNOT: noqa is shared with pyright.
    "RUF106",  # rule-codes-in-suppression  WHYNOT: same as RUF105.
    "RUF201",  # rule-codes-in-selectors  WHYNOT: config should be terse.
    "PLW1514", # unspecified-encoding  WHYNOT: UTF-8 is the only sane default.
    "PT029",   # pytest-warns-without-warning  WHYNOT: any warning will do.
    "TID254",  # lazy-import-mismatch  WHYNOT: startup perf is YAGNI.
    "TID255",  # lazy-import-immediately-resolved  WHYNOT: same as TID254.
    "ANN001",  # missing-type-function-argument  WHYNOT: 引数は pyright が推論。
    "ANN002",  # missing-type-args  WHYNOT: same as ANN001.
    "ANN003",  # missing-type-kwargs  WHYNOT: same as ANN001.
    "ANN202",  # missing-return-type-private-function  WHYNOT: same as ANN001.
    "ANN204",  # missing-return-type-special-method  WHYNOT: same as ANN001.
    "ANN205",  # missing-return-type-static-method  WHYNOT: same as ANN001.
    "ANN206",  # missing-return-type-class-method  WHYNOT: same as ANN001.
    "ANN401",  # any-type  WHYNOT: 外部 API の未型付けオブジェクトを Any で受けるのは正当。
    "FA",      # flake8-future-annotations  WHYNOT: 未来 import の強制は不要。
]
logger-objects = []
select = ["ALL"]
task-tags = [
    "WIP",
    "TBD",
    "HOLD",
    "PLAN",
    "MVP",
    "WANT",
    "PILOT",
    "TODO",
    "BUG",
    "FIXME",
    "HACK",
    "MISSING",
    "DOCME",
    "UPGRADE",
    "MEMO",
    "NOTE",
    "DEMO",
    "CASE",
    "MUST",
    "SHOULD",
    "MAY",
    "OPTIONAL",
    "FOLLOW",
    "WHYNOT",
    "RISK",
    "WARN",
    "IDEA",
    "IMO",
    "YAGNI",
    "ADR",
    "CONTEXT",
    "BLOCKER",
    "REVIEW",
    "DISCUSS",
    "REQUEST",
    "ISSUE",
    "QUESTION",
    "BLUE",
    "RED",
    "GREEN",
    "REFACTOR",
    "UNCOVERED",
    "FLAKY",
    "SLOW",
    "OVERTEST",
    "BENCHMARK",
    "SCALE",
    "BOTTLENECK",
    "SECURE",
    "VULNERABILITY",
    "PRIVACY",
    "ILLEGAL",
    "ACCESSIBILITY",
    "LOCALIZE",
    "DEPRECATE",
    "DEBT",
    "UNKNOWN",
]

[tool.ruff.lint.per-file-ignores]
# CONTEXT: E402/INP001 are self-evident for __init__.py; skipping per-code notes.
"__init__.py" = ["E402", "INP001", "N999"]
"tests/*" = [
    "ARG",    # flake8-unused-arguments  CONTEXT: fixtures inject args tests don't always use.
    "FBT",    # flake8-boolean-trap  CONTEXT: parametrize passes bare booleans.
    "S",      # flake8-bandit  CONTEXT: hardcoded secrets/asserts are expected in tests.
    "E402",   # module-import-not-at-top  CONTEXT: fixtures often import after setup code.
    "E501",   # line-too-long  CONTEXT: assertion diffs run long.
    "INP001", # implicit-namespace-package  CONTEXT: test dirs skip __init__.py by convention.
    "ANN",    # flake8-annotations  CONTEXT: テストの型注釈は要求しない。
    "PT011",  # pytest-raises-too-broad  CONTEXT: ValueError 等の広さがテスト意図に合致。
    "PT013",  # pytest-raises-with-multiple-exceptions  CONTEXT: 複数例外はテストで自然。
    "PT015",  # pytest-assertion-in-raisable-block  CONTEXT: raises 内の assert は意図的。
    "B011",   # assert-false  CONTEXT: 到達しないことを明示する assert はテストで正当。
    "D",      # pydocstyle  CONTEXT: テスト docstring の整形は要求しない。
    "RUF003", # ambiguous-unicode-character-comment  CONTEXT: 全角引用符コメント。
    "PLC0415",# import-outside-top-level  CONTEXT: fixtures が setup 後に import する。
    "N999",   # invalid-module-name  CONTEXT: test_example_*.py は分割前からの命名で、ledger と docs が名前で参照する。
    "PLW1510",# subprocess-run-without-check  CONTEXT: run_pipe は returncode を assert する。
    "PT006",  # pytest-parametrize-names-wrong-type  CONTEXT: 既存の parametrize 名。
]
# The parser and the Z3 encoder moved to tools/when_model.py (TODO.md §23.1), so
# their complexity/return/branch/RUF010 ignores followed the code. EM102 stays:
# this module's questionnaire-ordering errors still embed the offending name.
"tests/test_copier_structure.py" = [
    "EM102", # f-string-in-exception  CONTEXT: the message names the question and field it rejected.
]
"tools/when_model.py" = [
    "C901",    # too-complex  CONTEXT: a tokenizer plus a recursive-descent parser is branchy by design.
    "PLR0911", # too-many-return-statements  CONTEXT: ditto.
    "PLR0912", # too-many-branches  CONTEXT: ditto.
    "EM102",   # f-string-in-exception  CONTEXT: every model limitation names the expression it gave up on.
    "TRY004",  # type-check-without-type-error  CONTEXT: AssertionError here means "outside the modeled subset" (which the tests assert on), not a caller type error.
]
"tests/test_when_model.py" = [
    "SLF001", # private-member-access  CONTEXT: the oracle must be copier's own questionnaire pass (Worker._ask), not a re-implementation of it.
]
"tools/predicates.py" = [
    "SLF001", # private-member-access  CONTEXT: same oracle as tests/test_when_model.py: the evaluator runs copier's own pass (Worker._ask + _render_context) per witness leaf.
]
"tools/*" = [
    "INP001", # implicit-namespace-package  CONTEXT: standalone maintenance scripts, not a package.
]
# The lazy-facade modules (adopt/gen_docs/mcp_server) resolve re-exports via
# __getattr__ by design: names exist only after first access, and deferred
# imports inside functions break the facade->leaf->facade static cycle.
# PLC0415/EM101+F401-under-__getattr__/F822-under-__all__ are the mechanism,
# not accidents.
"tools/adopt.py" = ["PLC0415", "EM101", "EM102", "F401", "F822", "N807"]
"tools/gen_docs.py" = ["PLC0415", "EM101", "EM102", "F401", "F822"]
"tools/mcp_server.py" = ["PLC0415", "EM101", "EM102", "F401", "F822"]
"tools/adopt_*.py" = ["PLC0415"]
"tools/gen_docs_*.py" = ["PLC0415"]
"tools/mcp_*.py" = ["PLC0415"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 150

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"dask.dataframe" = "dd"
"xarray" = "xr"
"scipy" = "sp"
"skopt" = "sko"
"skimage" = "ski"
"sklearn" = "sk"
"returns" = "rt"
"pandera" = "pa"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = true

[tool.ruff.lint.flake8-errmsg]
max-string-length = 20

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.typos.default]
# The ethics baseline files carry trigger-regex stems (`certificat`,
# `advertis` -- deliberate word-stem matches) and proper nouns (`certifi`
# the package, `HashiCorp`) that the spellchecker must not correct.
# `fpr`/`fnr` are the fairness-metrics acronyms the ethics appendix's code
# examples use. typos is report-only in this repo's tasks for the same
# reason as in generated ones (-w rewrites identifiers silently), so a
# legit acronym identifier belongs in these ignore lists rather than in a
# rename.
extend-ignore-words-re = ['\b[A-Z]{3}\b', 'certifi', 'certificat', 'HashiCorp', 'advertis', 'fpr', 'fnr']
extend-ignore-identifiers-re = ['\b[A-Z]{3}\b', 'certifi', 'certificat', 'HashiCorp', 'advertis', 'fpr', 'fnr']

[tool.typos.files]
# template/ は生成コード。生成先プロジェクト側でチェックされる。
extend-exclude = ["template", "docs", "tools/licenses", "*.po", "src/3rdParty", "**/build*", "ACKNOWLEDGEMENTS", "notes", "CHANGELOG.md"]

[tool.vulture]
paths = ["tests", "tools"]
min_confidence = 60
# pytestmark is read by pytest's module reflection, which vulture cannot see.
# dst_path / quiet are copier Worker attributes tests/support.py rebinds per
# replay call; copier itself reads them.
ignore_names = ["pytestmark", "dst_path", "quiet"]
# Entry points whose callers vulture cannot see: the MCP tools in
# tools/mcp_server.py are invoked by MCP hosts (same idea as @app.route),
# HTTP routes are registered by their decorator, and pytest discovers
# fixtures by name. hypothesis registers @rule/@invariant methods the same
# way.
ignore_decorators = ["*tool*", "*resource*", "*route*", "*fixture*", "@rule", "@invariant"]

[tool.deptry]
# 依存はプロジェクト本体を含む。DEP002（未使用依存）は使い始めるまで出るので無視する。
per_rule_ignores = "DEP002=copier|zensical|mkdocstrings|tox-uv|hypothesis|pip-audit|pyproject-fmt|vulture|deptry|typos|pyrefly|basedpyright|coverage|pytest-randomly,DEP003=daimonion,DEP004=jinja2|copier|yaml|mcp|starlette|tomlkit|z3"
# template/ は生成コード。依存は生成先プロジェクト側で検査される。
# tests/ は pytest の暗黙パッケージ import (support, test_recommended_path) があり依存検査と相性が悪い。
# .cache/ は tests/render_cache.py が置くレンダ済みプロジェクト（生成コード）で、
# deptry は .gitignore を見ないのでここで除外する。
exclude = ["template", "tests", "docs", ".cache", ".venv", ".pixi", ".tox", "build", "dist"]

[tool.pyproject_fmt]
keep-full-version = true
no-generate-python-version-classifiers = true

[tool.coverage.run]
# tools/* は subprocess 実行され、template/ の生成コードは生成先プロジェクト側で
# 計測されるので source には含めない。
patch = ["subprocess"]
source = ["tools"]
# プロジェクトローカルのデータファイル（生成物へ出している設定と同じ）。
# pytest-xdist (-n auto) の各 worker が共有 /tmp で競合しないよう parallel 化し、
# pytest-cov が最後にマージする。
data_file = ".coverage"
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
# 下限はラチェット（目標ではない）。2026-09-14 実測: tools/ の網羅率は
# 全体 79.9%（`uv run --no-sync pytest -q --cov --cov-report term`、4276 文中
# 861 未達）、fast tier 79.8%（同 -m "not heavy and not slow"）、fast+heavy 79.8%。
# 4276 文で 1 ポイント ≈ 43 文なので、測定値の約 2 ポイント下（≈ 85 文）に置く:
# テストの無いモジュール（数百文）が入れば数ポイント落ちて fail し、稼働中の
# 小さな編集では pre-release gate（`task check` → `task test`）を赤くしない。
# 数値を下げる変更は「テストされていないコードが増えた」signal なので、まず
# テストを足すか上のコマンドで測り直すこと。`task test` が --cov を出す唯一の口。
fail_under = 78
