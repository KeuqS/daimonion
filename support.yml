# Support matrix for daimonion (PLAN-improvements W4).
#
# Tiers
# -----
# full        Executed end to end by the witness full tier: `uv sync`, the
#             generated project's own pytest, basedpyright and its docs
#             build. Measured at ~3 min per leaf (tests/test_witness_matrix.py
#             FULL_SAMPLE), so only the eight leaves below run it.
# fast        Rendered by the witness fast tier and kept ruff-format /
#             ruff-check clean. 205 leaves at ~1.3 s per render: 10-20 s
#             parallel, 3 m 40 s serial. Render-only -- no install, no run.
# best_effort Declared so the questionnaire's existing answers keep rendering,
#             but never CI-gated for execution: no `uv sync`, no pytest, no
#             type checker. These are the long tail W4 keeps as answers
#             instead of removing.
# none        Reserved for a future W4 declaration: no witness leaf is
#             unsupported today, so the policy table has no `none` row.
#
# `demotion` states when a declared combination stops being carried: the
# mechanical triggers that move a row down a tier (full -> best_effort ->
# none) and the evidence each trigger is read from. It is prose, not a
# second machine: tests/test_support_matrix.py reads only `supported` /
# `best_effort` / `tier_policy`, and the tier_policy `none` row already
# names the exclusion mechanism (tests/matrix/witnesses.json `tier: none` +
# `reason`). A row that meets a trigger is moved by a normal support.yml
# edit (the generated docs follow through tools/gen_docs.py); this section
# only says which moves are legitimate, so a removal is a policy
# application rather than a silent scope cut.
#
# The triggers compose with the §40 layer-owner rule (GOVERNANCE.md "Layer
# ownership"): an ownerless layer whose leaves drop to `experimental` in
# docs/reference/support.md is trigger 1 firing with the reviewer named as
# the missing piece. Regaining `supported` needs the same thing in both
# places: a named owner who reviews that layer's PRs.
#
 # tests/test_support_matrix.py checks the `supported` rows against the
 # witness ledger (tests/matrix/witnesses.json) and docs/reference/support.md
 # against this file.

supported:
  - combination: "project_type=library/gate=recommended"
    tier: full
    why: "recommended library path, executed end to end (~3 min): uv sync + generated pytest + basedpyright + docs"
  - combination: "project_type=cli/gate=recommended"
    tier: full
    why: "recommended CLI path, executed end to end (~3 min): console-script entry point and its CLI tests in the generated pytest run"
  - combination: "project_type=web_api/gate=recommended"
    tier: full
    why: "recommended web-API path, executed end to end (~3 min): FastAPI + SQLAlchemy + Alembic stack, tests against SQLite"
  - combination: "project_type=data_science/gate=recommended"
    tier: full
    why: "recommended data-science path, executed end to end (~3 min): the torch dependency sync is the slowest leaf but still inside the sample"
  - combination: "project_type=script/gate=recommended"
    tier: full
    why: "recommended script path, executed end to end (~3 min): flat stdlib-style workspace, pytest + basedpyright + docs run"
  - combination: "project_type=micropython/gate=recommended"
    tier: full
    why: "recommended MicroPython path, executed end to end (~3 min): generated type checks pass against the micropython-*-stubs"
  - combination: "project_type=online_judge/gate=recommended/oj=competitive_coding/atcoder"
    tier: full
    why: "AtCoder workspace, executed end to end (~3 min): the one online-judge leaf in the sample; the other judges render only"
  - combination: "project_type=cli/gate=off:use_recommended_agent"
    tier: full
    why: "the only branch-only artifact set in the sample: the agent gate off renders prompts/, which no recommended leaf produces"

best_effort:
  - combination: "task_runner = make | poe | invoke | duty"
    tier: best_effort
    why: "measured: only lint/test/check execute (test_task_runners.py::test_lint_task_executes for all four, ::test_test_task_executes_on_make, ::test_check_task_executes_on_poe); fix/type-check/audit/license-check/docs/docs-serve are render-only on these runners, and no witness leaf selects one"
  - combination: "package_manager = poetry"
    tier: best_effort
    why: "no witness leaf selects it (every leaf renders uv), but the weekly poetry-render-test job proves install/run: a poetry render ships an explicit [tool.poetry] packages table plus an importlib.metadata _version fallback, so `poetry install` + the generated pytest pass; tests/test_example_toolchain.py::test_template_poetry pins both"
  - combination: "log_library = loguru | picologging"
    tier: best_effort
    why: "structlog is the default and the full sample exercises only it; loguru/picologging execute solely in the network-marked test_example_toolchain cases (::test_template_log_library_loguru / ::test_template_log_library_picologging)"
  - combination: "type_checker = ty"
    tier: best_effort
    why: "pyrefly is the checker with deps installed (test_generated_typecheck.py runs `pyrefly check`); ty is render-only (tests/test_example_docs_ci.py::test_template_ty asserts the rendered pyproject)"
  - combination: "project_type=ros2"
    tier: best_effort
    why: "the full tier omits it: the generated test/build recipes need a ROS distribution (/opt/ros/$ROS_DISTRO), not a bare runner; the fast tier still renders all 8 ros2 leaves"
  - combination: "project_type=online_judge/.../oj=* except atcoder"
    tier: best_effort
    why: "the non-AtCoder judges (leetcode / yukicoder / aoj / codeforces / kattis / other / ctf / kaggle) render and ruff-check in the fast tier but never get a venv; only atcoder is in the full sample"
  - combination: "any leaf under an opt-in layer (include_ctf | include_data_science | include_scraping | include_web_api | include_bot)"
    tier: best_effort
    why: "the layer leaves render and ruff-check in the fast tier; only the eight sampled leaves get the execution tier"
  - combination: "any detailed-question branch (gate=off:use_recommended_*)"
    tier: best_effort
    why: "only cli/gate=off:use_recommended_agent is in the sample; the remaining gate-off branches are fast-tier renders, not executions"
  - combination: "any domain-trait variant (domain_traits selects personal-data / face-recognition / medtech)"
    tier: best_effort
    why: "the domain traits route ethics sections and one dependency; the derived variants render and ruff-check in the fast tier, and the sections' presence is asserted by the ethics-appendix predicate there rather than by executing a project"
  - combination: "any distribution variant (distribution answers commercial and/or oss)"
    tier: best_effort
    why: "the distribution answer routes the EU CRA section; the derived variants render and ruff-check in the fast tier, and the art. 24 exemption (oss alone ships nothing) is asserted by the additivity check rather than by executing a project"

tier_policy:
  - leaf_class: "project_type=*/gate=recommended (library, web_api, cli, data_science, script, micropython, online_judge)"
    tier: full
    why: "one leaf per project family is executed end to end; ros2 is deliberately not among them (see below)"
  - leaf_class: "project_type=cli/gate=off:use_recommended_agent"
    tier: full
    why: "the branch-only prompts/ artifact set is only produced with the agent gate off, so its leaf is in the sample"
  - leaf_class: "project_type=ros2/gate=recommended"
    tier: fast
    why: "render + ruff only: executing a ros2 leaf needs /opt/ros/$ROS_DISTRO on the runner"
  - leaf_class: "project_type=*/gate=off:use_recommended_* (detailed branches)"
    tier: fast
    why: "rendered and ruff-checked; the 3 m/leaf execution cost limits the full tier to the sample above"
  - leaf_class: "project_type=*/.../include=include_*"
    tier: fast
    why: "the opt-in layers (ctf / data_science / scraping / web_api / bot) are coverable by rendering: their artifacts are file-set invariants; the bot layer's real execution is tests/test_bot_layer.py's heavy case"
  - leaf_class: "project_type=online_judge/.../oj=*"
    tier: fast
    why: "AtCoder carries the execution sample; leetcode / yukicoder / aoj / codeforces / kattis / other / ctf / kaggle are render-only"
  - leaf_class: "project_type=*/.../domain=* (domain_traits variants)"
    tier: fast
    why: "a domain trait adds an ethics section (and for face-recognition a dependency) and no artifact: its presence is the ethics-appendix predicate's business, which render + ruff-check already exercises. The co-occurrence leaf is what the additivity check compares against the solo ones"
  - leaf_class: "project_type=*/.../distribution=* (distribution variants)"
    tier: fast
    why: "the distribution answer adds one ethics section (the EU CRA duties on `commercial`) and no artifact; render + ruff-check exercises it, and the additivity check pins that `oss` alone ships nothing (art. 24's non-commercial exemption)"
  - leaf_class: "(reserved) no class today"
    tier: none
    why: "every declared witness leaf has a recorded fast-tier run; tests/matrix/witnesses.json keeps the tier:none + reason hook as the future exclusion mechanism"

demotion:
  # A combination is demoted (full -> best_effort) or removed (any tier ->
  # none, via the tier:none + reason hook above) when ALL of a trigger's
  # conditions hold at the same time. Each condition names the evidence it
  # is read from, so applying a trigger is a lookup, not a judgement call.
  # Scale background: 618 tracked files, 55 test modules, 272 witness
  # leaves; every surviving answer multiplies the render matrix, so an
  # option nobody exercises still costs ruff/lint attention on every
  # template edit.
  - trigger: "ownerless layer"
    moves: "supported -> best_effort (the row keeps rendering; CI stops executing it)"
    when:
      - "no CODEOWNERS row names an owner for the layer besides the maintainer (evidence: .github/CODEOWNERS)"
      - "the maintainer has stopped reviewing that layer's area (evidence: GOVERNANCE.md 'Ownerless-layer rule')"
    restore: "a named owner who reviews that layer's PRs (evidence: the CODEOWNERS row); the support.yml row moves back with the same edit"
    why: "this is the §40 rule restated as a trigger: 'supported but not staffed' is honest only while the maintainer still reviews; otherwise the tier overclaims"
  - trigger: "no execution evidence"
    moves: "supported -> best_effort, or best_effort -> none for an answer nobody renders"
    when:
      - "no witness leaf selects the combination (evidence: tests/matrix/witnesses.json has no leaf with these answers)"
      - "no preset ships it (evidence: presets/*.yml)"
      - "no full-tier run has ever recorded it (evidence: the witness ledger)"
    restore: "a witness leaf plus the execution run that earns the tier back"
    why: "render-only today: task_runner make | poe | invoke | duty, package_manager poetry, log_library loguru | picologging and type_checker ty are all best_effort on exactly these grounds -- no witness leaf selects one, and the executed sample covers only the recommended defaults"
  - trigger: "rehearsal gap"
    moves: "supported -> best_effort until the gap is closed and recorded"
    when:
      - "the weekly update rehearsal (docs/data/update-rehearsal.json) skips or fails the leaves carrying the combination for two consecutive runs (evidence: the committed report)"
      - "no follow-up commit records the fix or the explicit acceptance (evidence: the 'Update rehearsal' section of docs/reference/support.md)"
    restore: "a green rehearsal run that covers the leaves again"
    why: "GOVERNANCE.md 'Release discipline': generated-project claims must not exceed what the rehearsal executed; a path the rehearsal no longer covers keeps rendering but stops promising updates land cleanly"
