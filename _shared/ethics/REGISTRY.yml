      - https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.205.pdf
      - https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
    scope: {jurisdiction: [], sector: [], category: [crypto]}
