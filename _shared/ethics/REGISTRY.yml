version: 1
# The single source for the ethics/regional/operational sections accumulated
# under _shared/ethics/. A row answers: what rule, which version, from which
# primary source, who it applies to, how strongly it is enforced, and where
# (if anywhere) it is distributed. A draft lives here as documentation only
# and no template/ file includes it (leaf +0); an active section is included
# from exactly the parents its row names in `rendered_from` (first promotion:
# the AGENTS.md ethics appendix, 2026-09).
#
# Lifecycle: draft (repo-local reference only) -> active (bundled as an
# appendix into an existing conditional doc, e.g. CHARTER/data appendix) ->
# kind (distributed on its own condition; the promotion PR wires the
# questionnaire, the witness leaves, invariants.yml and this registry row).
# `superseded_by` names the successor id; the file stays one version.
#
# `gate` is a Jinja/Python-compatible expression evaluated against the leaf
# context in tools/ethics.py (`gate_holds`); it is the single spelling of
# "which leaf carries this section" — the generated
# _shared/ethics-appendix.jinja emits it verbatim into each `{% if %}` and
# the render-invariants predicate evaluates the same string on the test side.
# The expression vocabulary is the leaf context's keys (`*_effective`,
# `*_layout`, the domain/distribution multiselects as lists, `oj_code`,
# `kaggle`, ...); the registry test pins every row's gate to that allowlist.
sections:
  - id: baseline-license-drift
    file: _shared/ethics/baseline/license-drift.md.jinja
    version: 2026-09-21.1
    effective: 2023-08-10
    review_by: 2027-03-31
    sources:
      - https://www.hashicorp.com/blog/terraform-is-now-source-available
      - https://opentofu.org/faq/
    scope: {jurisdiction: [], sector: [], category: [licensing]}
    scale: global
    audience: [library, cli, script, web, data-science]
    enforcement: L2
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "true"
    superseded_by: null
    why: "Terraform MPL-2.0 to BUSL 1.1 plus the OpenTofu cease-and-desist, and the reverse Elastic/Redis AGPL returns: a dependency's license is a moving value that must be re-checked, never remembered. L2 since 2026-09-19: the generated project ships a license-check gate (pip-licenses --partial-match --fail-on, policy derived from the project license) wired into CI."

  - id: baseline-pki-chain
    file: _shared/ethics/baseline/pki-chain.md.jinja
    version: 2026-09-21.2
    effective: 2024-06-06
    review_by: 2026-12-18
    sources:
      - https://letsencrypt.org/certificates/
      - https://letsencrypt.org/2023/07/10/cross-sign-expiration
      - https://letsencrypt.org/2024/04/12/changes-to-issuance-chains
      - https://community.letsencrypt.org/t/isrg-root-x2-cross-signed-by-isrg-root-x1/239124
      - https://community.cloudflare.com/t/clarification-about-email-upcoming-lets-encrypt-certificate-chain-change/628713
    scope: {jurisdiction: [], sector: [], category: [pki]}
    scale: global
    audience: [iot, cli, web]
    enforcement: L0
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "project_type in ['micropython', 'cli'] or web_api"
    superseded_by: null
    why: "Chain-of-trust rewrites (DST Root CA X3 gone 2024-09, ISRG Root X2 cross-sign gone 2025-09, CDNs rotating issuers) break hardcoded intermediates and single-key pins. Active since 2026-09-21: AGENTS.md now renders for micropython/ros2/online_judge too, so the guide itself is the channel the former draft was waiting for (iot maps to micropython by the AGENTS.md gate; ros2 stays outside the audience by its own condition)."

  - id: baseline-personal-data
    file: _shared/ethics/baseline/personal-data.md.jinja
    version: 2026-09-21.1
    effective: 2018-05-25
    review_by: 2027-03-31
    sources:
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj
      - https://www.ppc.go.jp/personalinfo/legal/
      - https://oag.ca.gov/privacy/ccpa
    scope: {jurisdiction: [], sector: [], category: [privacy]}
    scale: global
    audience: [library, cli, script, web, data-science, kaggle, mcp]
    enforcement: L1
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "'personal-data' in domain_traits or 'face-recognition' in domain_traits or 'medtech' in domain_traits"
    superseded_by: null
    why: "GDPR art. 4/5/17/22, Japan's 個人情報保護法 and the US state laws impose the same engineering duties from different directions: minimise what is collected and logged, make deletion reach every copy, and know what leaves the process. The section is asked rather than derived because the answers cannot tell a project that handles people from one that handles things -- a web API with a database stores `Item(name)`, and deriving 'has a DB therefore personal data' would ship these rules to 74 of 240 leaves, which is the over-distribution the ethics-appendix predicate calls uninvited. L1: tools/ethics.py's presence trigger fires on the code vocabulary, and the predicate asserts the section appears exactly where the answer selects it."

