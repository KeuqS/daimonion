  - id: domain-ml-bias
    file: _shared/ethics/domain/ml-bias.md.jinja
    version: 2026-09-21.3
    effective: 2024-08-01
    review_by: 2026-12-18
    sources:
      - https://www.nejm.org/doi/full/10.1056/NEJMc1919366
      - https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    scope: {jurisdiction: [], sector: [], category: [ml-fairness]}
    scale: global
    audience: [data-science, kaggle]
    enforcement: L0
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "ds_stack"
    superseded_by: null
    why: "Pulse-oximetry occult-hypoxemia disparity and EU AI Act art. 10 data-governance duties: subgroup metrics, documented fairness-metric choice, and human review are the minimum evaluation surface. The 適用条件 widens to any automatic decision about a person (2026-09-20): a scoring/screening endpoint is in scope whatever its accuracy, which is the case GDPR art. 22 and the AI Act's high-risk duties turn on. When such a project also answers `personal-data`, the privacy section carries the explainability-and-record-keeping side, so this row keeps its ds/kaggle audience and does not duplicate it."

  - id: domain-face-recognition
    file: _shared/ethics/domain/face-recognition.md.jinja
    version: 2026-10-06.1
    effective: 2025-02-02
    review_by: 2027-03-31
    sources:
      - https://nvlpubs.nist.gov/nistpubs/ir/2019/NIST.IR.8280.pdf
      - https://eur-lex.europa.eu/eli/reg/2024/1689/oj
      - https://web.archive.org/web/20250630192313/https://www.ilga.gov/legislation/ilcs/ilcs3.asp?ActID=3004
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj
    scope: {jurisdiction: [], sector: [], category: [biometrics]}
    scale: global
    audience: [data-science, web, cli, mcp]
    enforcement: L1
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "'face-recognition' in domain_traits"
    superseded_by: null
    why: "NIST FRVT Part 3 found false-positive rates differing by orders of magnitude across demographic groups, so a single matching threshold converts a measurement gap into an operational one; EU AI Act art. 5 bans several face-recognition uses outright (untargeted scraping, workplace/education emotion recognition, real-time public biometric ID), and BIPA/GDPR make the template store and consent terms legal duties rather than design taste. L1: tools/ethics.py's presence trigger fires on the code vocabulary, and invariants.yml's ethics-appendix predicate asserts the section appears exactly where the audience matches."

  - id: sector-samd-regulatory
    file: _shared/ethics/sector/samd-regulatory.md.jinja
    version: 2026-09-21.1
    effective: 2024-12-04
    review_by: 2026-12-18
    sources:
      - https://www.fda.gov/regulatory-information/search-fda-guidance-documents/marketing-submission-recommendations-predetermined-change-control-plan-artificial-intelligence-enabled-device-software-functions
      - https://eur-lex.europa.eu/eli/reg/2017/745/oj
      - https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    scope: {jurisdiction: [], sector: [medtech], category: [regulatory]}
    scale: global
    audience: [data-science, web, cli, mcp]
    enforcement: L1
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "'medtech' in domain_traits"
    superseded_by: null
    why: "FDA's PCCP final guidance (2024-12), Japan's IDATEN and the EU MDR + AI Act stack all converge on one rule: continuous learning is allowed only inside a pre-approved change envelope, with humans deciding. Promoted from draft when the domain_traits multiselect landed: the section was previously unroutable because 'medical' is a purpose, not a layout -- a health-data CLI or an MCP server exposing a clinical tool was in scope by the section's own 適用条件 while no gate could reach it. L1: tools/ethics.py's presence trigger fires on the clinical vocabulary, and invariants.yml's ethics-appendix predicate asserts the section appears exactly where the answer selects it."

  - id: region-eu-cra
    file: _shared/ethics/region/eu-cra.md.jinja
    version: 2026-10-04.1
    effective: 2026-09-11
    review_by: 2027-03-31
    sources:
      - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
      - https://digital-strategy.ec.europa.eu/en/policies/cra-reporting
    scope: {jurisdiction: [eu], sector: [], category: [supply-chain-security]}
    scale: regional
    audience: [library, cli, web, mcp]
    enforcement: L1
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "'commercial' in distribution"
    superseded_by: null
    why: "Regulation (EU) 2024/2847 applies in stages: conformity-assessment notification since 2024-06-11, the reporting duty since 2026-09-11 (already live), the main obligations from 2027-12-11. It reaches non-EU developers who place products on the EU market, and art. 24's free-software exemption holds only while the work is non-commercial -- which is why the gate is the `distribution` answer (commercial), not a jurisdiction question: the answer that decides whether a regulator cares is monetisation, and asking a personal project about CE marking would be the over-distribution the ethics-appendix predicate calls uninvited. The mechanical half (SBOM generation, dependency vulnerability monitoring) is what a template can actually ship; the 24-hour reporting duty stays process, documented rather than automated. L1: tools/ethics.py's presence trigger fires on the code vocabulary, and the predicate asserts the section appears exactly where `distribution` selects it."

  - id: domain-scraping-law
    file: _shared/ethics/domain/scraping-law.md.jinja
    version: 2026-09-24.1
    effective: 2022-04-18
    review_by: 2027-03-31
    sources:
      - https://cdn.ca9.uscourts.gov/datastore/opinions/2022/04/18/17-16783.pdf
      - https://eur-lex.europa.eu/eli/dir/1996/9/oj
      - https://www.bunka.go.jp/seisaku/chosakuken/aiandcopyright.html
      - https://laws.e-gov.go.jp/law/411AC0000000128
      - https://www.rfc-editor.org/rfc/rfc9309.html
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj
      - https://www.ppc.go.jp/personalinfo/legal/
    scope: {jurisdiction: [], sector: [], category: [copyright, privacy]}
    scale: global
    audience: [cli]
    enforcement: L0
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "scraping_effective"
    superseded_by: null
    why: "hiQ v. LinkedIn (9th Cir. 2022) read the CFAA's 'without authorization' as not covering public pages refused by cease-and-desist alone, which kept the tortious-interference claim alive while the CFAA argument stalled -- so the technical act can be lawful while the contract claim stands; the EU Database Directive's sui generis right (art. 7) bans extraction of a substantial part even where individual facts are not copyrightable; the Agency of Culture position (already cited in copyright-ai) treats deliberate robots.txt circumvention as potentially harming a paid data market; and CFAA / 不正アクセス禁止法 punish bypassing authentication, not reading public pages. robots.txt (RFC 9309) is evidence of the operator's intent, never an authorization. The gate is derived (scraping_effective) because the template only ships scraping code on that flag -- a project without the fetcher layer owes no scraping-law map. L0: the section reaches the AGENTS.md reader, and the ethics-appendix predicate asserts it appears exactly where scraping_effective holds."

  - id: domain-contest-rules
    file: _shared/ethics/domain/contest-rules.md.jinja
    version: 2026-09-24.1
    effective: 2025-10-03
    review_by: 2027-03-31
    sources:
      - https://info.atcoder.jp/entry/llm-rules-ja
      - https://atcoder.jp/posts/1347
      - https://icpc.global/regionals/rules
      - https://leetcode.com/contest/
      - https://codeforces.com/
      - https://open.kattis.com/
    scope: {jurisdiction: [], sector: [], category: [competition]}
    scale: global
    audience: [online-judge]
    enforcement: L0
    status: active
    rendered_from: ["_shared/ethics-appendix.jinja"]
    gate: "oj_code"
    superseded_by: null
    why: "AI-use rules differ per judge and change frequently: AtCoder's 生成AI対策ルール (current version 2025-10-03) bans generative AI during ABC/ARC/AGC except a whitelisted translation prompt, while AHC and practice runs keep their own rules; LeetCode, Codeforces, Kattis and ICPC publish theirs separately, so 'the judge allowed it last time' is never a safe assumption. The submission is the entrant's own responsibility whatever tool produced it, and rating manipulation / multi-accounting are banned on every platform. The gate is oj_code -- the code-submission judges, deliberately excluding the kaggle workspace and the CTF challenges, which matches the AGENTS.md banner's own split. L0: the section reaches the AGENTS.md reader; the ethics-appendix predicate asserts it appears exactly where oj_code holds."

