  - id: baseline-deprecated-crypto
    file: _shared/ethics/baseline/deprecated-crypto.md.jinja
    version: 2026-10-06.1
    effective: 2019-10-01
    review_by: 2027-03-31
    sources:
      - https://csrc.nist.gov/pubs/sp/800/131/a/r2/final
      - https://www.cryptrec.go.jp/en/index.html
    scope: {jurisdiction: [], sector: [], category: [crypto]}
    scale: global
    audience: [library, cli, web]
    enforcement: L0
    status: draft
    rendered_from: []
    superseded_by: null
    why: "NIST SP 800-131A Rev.2 sunset SHA-1 signatures (2013) and disallowed 3DES (2023); RFC 8996 deprecated TLS 1.0/1.1 and CRYPTREC dropped MD5/SHA-1/RC4 from the e-government list. New code must not introduce MD5/SHA-1 signatures, DES/3DES/RC4, TLS <=1.1, or RSA<2048. Drafted in the 2026-10-04 codex sync; promotion needs its gate + audience wiring like any other baseline row."

