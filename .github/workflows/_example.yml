on:
  workflow_call:
    secrets:
      EXAMPLE_DEPLOY_KEY:
        required: true
  # Manual run = the same regenerate + publish the ci.yml call performs on
  # every push to main; dispatching re-publishes the example repo on demand
  # (still requires the EXAMPLE_DEPLOY_KEY secret, which a direct dispatch
  # resolves from the repo's secret store -- `secrets:` is only declarable
  # under workflow_call, not here).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow pushes the regenerated example to the example repo
          # via a deploy key, so credentials are intentionally kept here
          # (unlike the other reusable workflows).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Explicit true (not the "auto" default) so tag-push runs also
          # cache: "auto" disables caching on tag pushes.
          enable-cache: true

      - name: Regenerate example
        env:
          # Derive the template source URL and example-repo owner from the
          # current repo so a rename does not leave a stale org hard-coded.
          TEMPLATE_URL: https://github.com/${{ github.repository }}.git
          EXAMPLE_OWNER: ${{ github.repository_owner }}
        run: |
          git init /tmp/example
          # --defaults answers questions added after example-answers.yml was
          # written (e.g. new opt-in layers) without an interactive session.
          uvx copier copy \
            --trust \
            --defaults \
            --data-file example-answers.yml \
            --data github_org="$EXAMPLE_OWNER" \
            --vcs-ref=HEAD . /tmp/example
          sed -i "s|_src_path: .*|_src_path: ${TEMPLATE_URL}|" /tmp/example/.copier-answers.yml
          uv lock --directory /tmp/example
          rm -rf /tmp/example/.git

      - name: Publish example
        # We pin to the SHA, not the tag, for security reasons.
        # https://docs.github.com/en/actions/learn-github-actions/security-hardening-for-github-actions#using-third-party-actions
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.EXAMPLE_DEPLOY_KEY }}
          publish_dir: /tmp/example
          external_repository: ${{ github.repository_owner }}/daimonion-example
          publish_branch: main
          enable_jekyll: true  # don't put a .nojekyll
          exclude_assets: ''  # default would exclude .github
