name: Scheduled full check

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Re-run the ci.yml lint/test/docs jobs weekly with zero code changes:
    # external toolchain drift (new ruff rules, basedpyright behaviour
    # changes, a pinned dependency's latest release) is invisible to
    # push/PR CI. Days are staggered from check-upstream.yml (Mon 06:00),
    # check-upstream-fork.yml (Tue 06:00), periodic.yml (Wed 08:00) and
    # scorecard.yml (Sat 01:30) so a failure names exactly one workflow.
    - cron: "0 7 * * TUE"

jobs:
  lint:
    uses: ./.github/workflows/_tasks.yml
    with:
      task_runner: task
      task: lint,type-check

  test:
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-24.04
      task_runner: task

  docs:
    uses: ./.github/workflows/_docs.yml
    with:
      task_runner: task
      # Build-only: a scheduled drift check must not publish docs.
      publish: false
    # _docs.yml's build job declares contents: write (needed for the gh-pages
    # publish path). A reusable workflow's permissions may not exceed the
    # caller's grant, so without this the whole run dies as startup_failure
    # before any job starts -- the weekly check never ran once.
    permissions:
      contents: write

  pixi-render-test:
    name: pixi render + test
    # DESIGN-ci-coverage.md §2 option (b): the template's own weekly proof
    # that the pixi venv path still works end to end. No witness leaf
    # selects pixi (every leaf renders uv), so the job renders its own
    # answers: a pixi-selected cli leaf with pixi native tasks (the
    # pixi.lock placeholder the render ships proves the branch). The render
    # runs the generated project's own `test` task the way its CI would
    # (`pixi run -e dev --locked`), after `pixi install`. Weekly-scheduled
    # only: the install resolves the full dependency tree from the network,
    # far too heavy for push/PR (like the ci.yml nightly heavy tier).
    # The poetry sibling (poetry-render-test below) is the same proof for
    # the poetry venv path (support.yml, best_effort): its render carries
    # an explicit `[tool.poetry] packages` table (Poetry 2.x auto-discovery
    # misses the renamed src/ package) and an importlib.metadata fallback
    # for the setuptools-scm version file poetry never writes.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The render below runs copier at --vcs-ref=HEAD against this
          # checkout: the job tests today's template, not the newest release.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Render the pixi leaf
        run: |
          set -euo pipefail
          # --defaults answers every question the --data flags leave out
          # (including the required "Project Details" block) without an
          # interactive session; --data wins over example-answers.yml for
          # the toolchain questions, so the leaf stays the example project
          # with only the package manager (and pixi's runner) switched.
          # package_name matches the distribution's normalized stem (both
          # derive from the same answers) so the editable install finds
          # the src/ package.
          uvx copier copy --trust --defaults \
            --data-file example-answers.yml \
            --data use_recommended_toolchain=false \
            --data package_manager=pixi \
            --data task_runner_pixi=pixi \
            --data package_name=daemon_example \
            --data distribution_name=daemon-example \
            --data repo_name=daemon-example \
            --vcs-ref=HEAD . /tmp/render-pixi
          test -f /tmp/render-pixi/pixi.lock
          grep -q '\[tool.pixi.feature.dev.tasks\]' /tmp/render-pixi/pyproject.toml

      - name: Install the pixi environment and run its test task
        working-directory: /tmp/render-pixi
        run: |
          set -euo pipefail
          pixi install
          pixi run -e dev --locked test

  poetry-render-test:
    name: poetry render + test
    # The poetry half of DESIGN-ci-coverage.md §2 option (b): the template's
    # own weekly proof that a poetry render installs and its generated
    # pytest passes. Same leaf-selection approach as pixi-render-test above
    # (no witness leaf selects poetry): a poetry-selected cli leaf whose
    # distribution name differs from its package name, which is exactly the
    # shape Poetry 2.x auto-discovery misses without the explicit packages
    # table the template now ships. The render runs the generated project's
    # own `test` task the way its CI would (`task test` -> `poetry run
    # pytest`), after `poetry install` writes the lockfile the render
    # deliberately does not ship. Weekly-scheduled only, like the pixi job:
    # the install resolves the full dependency tree from the network.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The render below runs copier at --vcs-ref=HEAD against this
          # checkout: the job tests today's template, not the newest release.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Install Task # task-version: v3.46.4
        # The generated leaf keeps the default `task` runner, so its `test`
        # task needs the binary (same direct install the setup-runner action
        # uses; the pin is tracked by the weekly check-upstream drift report).
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          curl -fsSL https://github.com/go-task/task/releases/download/v3.46.4/task_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/task-bin/task" --version

      - name: Render the poetry leaf
        run: |
          set -euo pipefail
          # Same --defaults/--data shape as the pixi leaf above: the leaf
          # stays the example project with only the package manager
          # switched. The distribution/package names differ on purpose --
          # that mismatch is the Poetry 2.x discovery case the packages
          # table exists for.
          uvx copier copy --trust --defaults \
            --data-file example-answers.yml \
            --data use_recommended_toolchain=false \
            --data package_manager=poetry \
            --data package_name=daemon_example \
            --data distribution_name=daemon-example \
            --data repo_name=daemon-example \
            --vcs-ref=HEAD . /tmp/render-poetry
          test ! -f /tmp/render-poetry/poetry.lock
          grep -q 'packages = \[{ include = "daemon_example", from = "src" }\]' /tmp/render-poetry/pyproject.toml

      - name: Install the poetry environment and run its test task
        working-directory: /tmp/render-poetry
        run: |
          set -euo pipefail
          poetry install
          task test
  law-map-review-by:
    name: law-map review_by drift
    # Obligation-graph freshness, not toolchain drift: every grounding in
    # ConstitutiveTemplates/law-map carries a review_by date, and an expired
    # one means the statute/citation needs human re-review. Different corpus
    # from ethics-sync.yml (which diffs the vendored prose SHA against
    # good-future-codex) and from check-upstream*.yml (upstream template
    # commits), so a failure here names exactly one thing to fix.
    # --codex also validates related_sections ids resolve inside
    # good-future-codex (sections/<tier>-<slug>.md.jinja); structural corpus
    # validation itself is law-map's own ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout law-map
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConstitutiveTemplates/law-map
          path: law-map
          persist-credentials: false

      - name: Checkout good-future-codex
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConstitutiveTemplates/good-future-codex
          path: good-future-codex
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Check obligation review_by dates
        id: check
        working-directory: law-map
        run: uv run law-map check --codex ../good-future-codex
        # Exits 1 only on EXPIRED groundings (due-within-horizon is a report,
        # not a failure) or on an unresolved related_sections id.

      - name: Open drift issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --search "law-map review_by expired" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "law-map review_by expired (scheduled check)" \
              --body "The weekly obligation-freshness check found expired review_by groundings in ConstitutiveTemplates/law-map (or an unresolved related_sections id). Re-review the cited statute/guidance and bump review_by. See: $RUN_URL" \
              --label "documentation"
          else
            echo "An issue for this drift is already open; skipping."
          fi

  open-drift-issue:
    name: Open issue on drift
    needs: [lint, test, docs, pixi-render-test]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --search "Scheduled full check failed" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Scheduled full check failed (no code change involved)" \
              --body "The weekly full check (lint/type-check/test/docs, same jobs as ci.yml) failed with no repo changes involved. This usually means an external toolchain (ruff, basedpyright, a pinned dependency's latest release, ...) changed behaviour. See: $RUN_URL"
          else
            echo "An issue for this drift is already open; skipping."
          fi
