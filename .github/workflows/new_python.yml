name: Support new version of python
on:
  # The cron fires once a year (December 1st, ahead of the October release
  # cadence's follow-up); dispatch exists so the checklist issue can be
  # filed manually at any other time too.
  workflow_dispatch:
  schedule:
    - cron: 0 9 1 12 *

permissions:
  contents: read

jobs:
  create_issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: Create new version of python issue
        run: |
          gh issue create \
            --title "$TITLE" \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Support new version of python
          BODY: |
            New versions of Python are normally released in October.
            Follow the checklist below to ensure support for the new version is added,
            and drop an old version so we support the most recent 4 versions.

            - [ ] Change `.python-version` to be the oldest supported version
            - [ ] Change `requires-python` in `pyproject.toml` to be the oldest supported version
            - [ ] Change `classifiers` in `template/pyproject.toml.jinja` to have all 4 versions
            - [ ] Change `requires-python` in `template/pyproject.toml.jinja` to be the oldest supported version
            - [ ] Change `requires-python` in the template lockfile (`template/uv.lock` or `template/pixi.lock`) to be the oldest supported version
            - [ ] Change `python-version` in `.github/workflows/ci.yml` and the generated `ci.yml.jinja` (under `template/.github/workflows/`, with `{% if git_platform=="github.com" %}` / `{% if ci_provider == 'github_actions' %}` conditional directory names) to have all 4 versions
            - [ ] Change first paragraph in `template/{% if docs %}docs{% endif %}/tutorials/installation.md.jinja` (the `{% if docs %}` dir is present only when docs are enabled) to be the oldest supported version
