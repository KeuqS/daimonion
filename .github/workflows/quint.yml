name: Quint models

# TODO.md §27.7 item 3: the adopt protocol's Quint models (TODO §27.3, V2)
# live in models/ so CI can re-verify the crash-safety proof instead of
# trusting the spike transcript.  Two runs, both load-bearing: the good model
# must verify (TLC exhausts the 51-state graph), and the late-journal mutant
# must fail with a counterexample -- if the mutant ever passes, the property
# the good model proves guards nothing.  See models/README.md.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "models/**"
      - ".github/workflows/quint.yml"
  pull_request:
    paths:
      - "models/**"
      - ".github/workflows/quint.yml"

jobs:
  verify:
    name: Verify the adopt crash-atomicity model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install quint (version pinned to the spike's)
        # No setup-java step on purpose: the TLC backend needs a JVM (see
        # models/README.md) and ubuntu-latest ships Temurin JDKs preinstalled.
        run: npm install --global @informalsystems/quint@0.32.0

      - name: Verify the good model (must hold)
        # TLC explores the full reachable graph (51 states) and asserts every
        # crash point is covered: a drifted tree is either a committed,
        # verified result or still undone by the journal.
        run: |
          quint verify --backend=tlc models/adopt_crash.qnt \
            --invariant=crash_window_covered,crash_point_recoverable,recovery_restores

      - name: Verify the late-journal mutant (must fail with a counterexample)
        # Guard the guard, inverted: the mutant writes the journal one step
        # late, so a crash before the journal exists loses the undo.  TLC must
        # find the 3-state counterexample; a failure that is *not* a
        # counterexample (tooling, missing JVM) also fails the job, so a
        # broken toolchain cannot fake a passing guard.
        run: |
          set +e
          quint verify --backend=tlc models/adopt_crash_journal_late.qnt \
            --invariant=crash_point_recoverable >"$RUNNER_TEMP/mutant.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/mutant.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::The late-journal mutant verified clean -- it must NEVER pass. A pass means the crash-window property no longer catches a journal written one step late, so the good model's proof guards nothing. See models/README.md."
            exit 1
          fi
          if ! grep -q "found a counterexample" "$RUNNER_TEMP/mutant.log"; then
            echo "::error::The mutant step failed, but not with a counterexample -- that is a tooling failure (e.g. a missing JVM), not the guard firing. See models/README.md."
            exit 1
          fi
          echo "The mutant failed with the expected counterexample: the guard holds."
