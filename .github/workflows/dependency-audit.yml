name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    # `task audit` == `uv run --locked pip-audit` (OSV-based) over the root
    # repo's own dependencies. PR CI deliberately does NOT run it: `check`
    # must work offline (Taskfile.yml keeps `audit` out of `check` for the
    # same reason), so this weekly schedule -- plus the manual
    # workflow_dispatch above -- is the only verification the audit task
    # gets. Renovate's vulnerabilityAlerts cover the GitHub Advisory feed,
    # but the sources differ. Results land in a deduplicated issue titled
    # "pip-audit found vulnerabilities in the template's own dependencies"
    # (the job below files it only when `task audit` exits nonzero).
    # Staggered from the other scheduled workflows (ci.yml nightly,
    # check-upstream.yml MON 06:00, check-upstream-fork.yml TUE 06:00,
    # scheduled-check.yml TUE 07:00, periodic.yml WED 08:00, scorecard.yml
    # SAT 01:30) so a failure names one workflow.
    - cron: "0 7 * * THU"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Task # task-version: v3.46.4
        # Direct binary install: arduino/setup-task is Node20-deprecated.
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          curl -fsSL https://github.com/go-task/task/releases/download/v3.46.4/task_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
          task --version

      - name: Audit dependencies
        id: audit
        run: task audit

      - name: Open vulnerability issue
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(uv run --locked pip-audit 2>&1 || true)
          existing=$(gh issue list --search "pip-audit found vulnerabilities" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "pip-audit found vulnerabilities in the template's own dependencies" \
              --body "$body"
          else
            echo "An issue for this audit failure is already open; skipping."
          fi
