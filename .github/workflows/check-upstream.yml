name: Check upstream pins

on:
  workflow_dispatch:
  schedule:
    # Template pins renovate cannot track (release tags, CUDA indexes,
    # distro EOLs, image tags); check weekly and open an issue on drift.
    - cron: "0 6 * * MON"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Check template pins against upstream
        id: check
        run: python3 tools/check_upstream.py
        # The checker exits 1 on any [DRIFT] line.

      - name: Open drift issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(python3 tools/check_upstream.py 2>&1 || true)
          # File only on real drift: a [warn] run means an upstream lookup
          # failed transiently, and a red run is the signal to re-run, not to
          # open a "pins are behind upstream" issue about nothing.
          if ! printf '%s' "$body" | grep -q '\[DRIFT\]'; then
            echo "The report has no [DRIFT] line: an unresolved lookup, not drift. Not filing."
            exit 0
          fi
          existing=$(gh issue list --search "Template pins are behind upstream" \
            --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Template pins are behind upstream" \
              --body "$body"
          else
            echo "An issue for this drift is already open; skipping."
          fi
