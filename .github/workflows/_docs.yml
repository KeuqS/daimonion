on:
  workflow_call:
    inputs:
      task_runner:
        type: string
        description: Which task runner drives the docs task (task, just, poe, make, invoke, duty, pixi)
        required: true
      publish:
        type: boolean
        description: Publish the build to gh-pages (scheduled drift checks pass false to build only)
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Serialize docs builds within this repository. A commit and its release
    # tag are often pushed together, which starts two ci.yml runs; both
    # would build docs and force-push gh-pages, colliding on the branch.
    # This replaces the old `sleep 60` head-start, which was a guess (a
    # build longer than the sleep still raced). One docs job runs at a
    # time; the next is pending (and a superseded pending publish being
    # replaced by a newer run is fine). cancel-in-progress must stay false:
    # never cancel a publish mid-flight. Do NOT use github.workflow in the
    # group -- inside a reusable workflow it resolves to the CALLER's name,
    # which would collide with the caller's own concurrency group.
    concurrency:
      group: docs-publish-${{ github.repository }}
      cancel-in-progress: false

    # Job-level grant: the caller (ci.yml) sets contents: write for the docs
    # job, but a reusable workflow's own top-level permissions cap it back to
    # read -- and repo-level default_workflow_permissions is read-only, so
    # the gh-pages publish would 403 without this explicit job grant.
    permissions:
      contents: write

    steps:
      # The checkout stays here, not in the composite: a local action's files
      # must exist before it can be invoked, so the composite cannot fetch the
      # repository it lives in (see setup-runner's description).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up the runner
        uses: ./.github/actions/setup-runner
        with:
          task_runner: ${{ inputs.task_runner }}
          uv_cache: true

      - name: Install system packages
        # graphviz installs in seconds, and the deb cache that used to sit here
        # (keyed on a weekly rotation) was removed in 162e44d0 after it poisoned
        # itself: apt creates .apt-cache/partial as root, the unprivileged cache
        # save then fails with EACCES, and the poisoned entry is restored on
        # every later run. Do not add it back without solving that.
        run: sudo apt-get install graphviz

      - name: Build docs
        env:
          TASK_RUNNER: ${{ inputs.task_runner }}
        run: |
          set -eu
          case "$TASK_RUNNER" in
            task) task docs ;;
            just) just docs ;;
            make) make docs ;;
            poe)
              if [ -f poetry.lock ]; then
                poetry run poe docs
              else
                uv run --locked poe docs
              fi
              ;;
            invoke)
              if [ -f poetry.lock ]; then
                poetry run invoke docs
              else
                uv run --locked invoke docs
              fi
              ;;
            duty)
              if [ -f poetry.lock ]; then
                poetry run duty docs
              else
                uv run --locked duty docs
              fi
              ;;
            pixi) pixi run -e dev --locked docs ;;
            *) echo "Unknown task runner: $TASK_RUNNER" >&2; exit 1 ;;
          esac

      - name: Upload built docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          # _release.yml zips this up. Sphinx writes build/html; zensical /
          # mkdocs (no docs/conf.py) writes site/ by default. Upload whichever
          # exists so the artifact always carries the built site.
          path: |
            build/html
            site
          if-no-files-found: error

      - name: Sanitize ref name for docs version
        run: echo "DOCS_VERSION=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" >> "$GITHUB_ENV"

      - name: Move to versioned directory
        run: |
          # Sphinx builds to build/html; zensical/mkdocs (no docs/conf.py)
          # builds to site/ per its default site_dir.
          if [ -f docs/conf.py ]; then
            mv build/html ".github/pages/$DOCS_VERSION"
          else
            mv site ".github/pages/$DOCS_VERSION"
          fi

      - name: Write switcher.json
        if: hashFiles('docs/conf.py') != ''
        run: python .github/pages/make_switcher.py --add "$DOCS_VERSION" "${{ github.repository }}" .github/pages/switcher.json

      - name: Publish Docs to gh-pages
        if: inputs.publish && (github.ref_type == 'tag' || github.ref_name == 'main')
        # We pin to the SHA, not the tag, for security reasons.
        # https://docs.github.com/en/actions/learn-github-actions/security-hardening-for-github-actions#using-third-party-actions
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/pages
          keep_files: true
