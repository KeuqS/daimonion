name: Periodic

on:
  workflow_dispatch:
  schedule:
    # Run weekly to check URL links still resolve
    - cron: "0 8 * * WED"

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Link Checker
        uses: lycheeverse/lychee-action@01a5c94d8e012550040658854b90a7a7301e75ca # v2.6.0
        with:
          # Docs + README; exclude the docs build output (site/ for
          # zensical/mkdocs, build/ for the local Sphinx-era leftovers) and
          # the vendored .github/pages helper (not user-facing links).
          args: --no-progress --exclude-path site --exclude-path build README.md docs
          fail: true

  patch-rot:
    # The F3/F5/F6/F7 copier contributions live as public branches on
    # kasi-x/copier (PR filing is manual per upstream AI_POLICY; the patch
    # workbench moved to the private kasi-x/daimonion-internal repo on
    # 2026-10-13). A branch whose tip diff stops applying to the pinned
    # upstream baseline is PR rot that otherwise surfaces only when a human
    # files the PR, so re-verify each branch's diff against a fresh pinned
    # checkout of copier-org/copier.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned upstream copier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: copier-org/copier
          ref: v9.18.1
          path: upstream-copier
          persist-credentials: false
      - name: Fetch contribution branches from the public fork
        run: |
          set -euo pipefail
          git -C upstream-copier remote add fork https://github.com/kasi-x/copier.git
          git -C upstream-copier fetch --quiet fork f3-missing-batch f5-stale-tag-warning f6-trust-discoverability f7-pretend-summary
      - name: Check every contribution branch still applies
        run: |
          set -euo pipefail
          failed=0
          for branch in f3-missing-batch f5-stale-tag-warning f6-trust-discoverability f7-pretend-summary; do
            git -C upstream-copier diff HEAD "fork/$branch" > "/tmp/$branch.patch" || true
            if [ ! -s "/tmp/$branch.patch" ]; then
              echo "ROT: $branch has no diff against v9.18.1" >&2
              failed=1
            elif git -C upstream-copier apply --check --verbose "/tmp/$branch.patch"; then
              echo "OK: $branch"
            else
              echo "ROT: $branch no longer applies against v9.18.1" >&2
              failed=1
            fi
          done
          exit "$failed"
