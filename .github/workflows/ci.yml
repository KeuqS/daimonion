name: CI

permissions:
  contents: read

concurrency:
  # One lane per event: a push to main must not cancel the nightly heavy run
  # (and vice versa); pushes/PRs still cancel their own predecessors.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    # Nightly heavy tier (the venv/network tests `-m heavy` that the PR/push
    # run skips) plus the randomized-order seed job (`test-randomly`).
    # Staggered from the other scheduled workflows
    # (check-upstream.yml MON 06:00, check-upstream-fork.yml TUE 06:00,
    # scheduled-check.yml TUE 07:00, periodic.yml WED 08:00, scorecard.yml
    # SAT 01:30) so a failure names exactly one workflow.
    - cron: "0 3 * * *"

# The scheduled run exists only for the nightly jobs below (the heavy tier and
# the randomized-order seed run): every other job
# already runs on each push to main, and docs/example have side effects
# (publishing, deploying the example repo) that a nightly run must not repeat.
jobs:
  changes:
    name: detect docs-only pull request
    # Docs-only gate for the render/test matrix below (TODO §23.2). This is a
    # job, NOT `on.pull_request.paths:`: a workflow skipped by path filtering
    # never reports its checks, so a required check would sit "Pending" and
    # block merging a docs-only PR (GitHub docs, "Troubleshooting required
    # status checks" -> "Handling skipped but required checks"). Keeping the
    # workflow unconditional and skipping individual jobs instead works with
    # branch protection: a job skipped by `if:` reports conclusion `skipped`,
    # which counts as a successful check status, and the
    # required-checks-passed jq below already tolerates `skipped` too.
    #
    # The job itself has no `if:` on purpose: a skipped `changes` job would
    # skip every job that needs it. On non-PR events only the steps are
    # skipped, the empty output reads as "not docs-only", and everything runs
    # (nightlies and tag pushes must never be gated by a diff).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the merge base against the PR's base branch resolves.
          fetch-depth: 0

      - name: Report whether the PR is docs-only
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          merge_base=$(git merge-base "origin/$BASE_REF" HEAD)
          docs_only=true
          # Every changed file must be docs for the matrix below to be skippable;
          # bash `case` patterns match across `/`, so `*.md` is any depth.
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$merge_base" HEAD)
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    # Not gated by `changes`: lint,type-check includes `typos`, which is
    # exactly the check a docs-only change needs.
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_tasks.yml
    with:
      task_runner: task
      task: lint,type-check

  hygiene:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_hygiene.yml

  test:
    # PR/push: the fast tier (`-m "not heavy and not slow and not meta and not network"`) -- no venv builds.
    # Docs-only PRs skip this job (see `changes`): the tier re-renders the
    # template, which a markdown change cannot affect.
    if: github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true'
    needs: changes
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-latest
      task_runner: task
      task: test-fast

  test-meta:
    # The cost ledger's own guard (`-m meta`): it re-collects every tier in its
    # own pytest sessions and scans every test module for unmarked venv/network
    # work, which is exactly what the edit loop's 30s budget cannot afford, so
    # `test-fast` excludes it and this job is where it runs.
    # Docs-only PRs skip it together with `test` (same `changes` gate).
    if: github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true'
    needs: changes
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-latest
      task_runner: task
      task: test-meta
      # Re-collecting six tiers is six pytest startups; the fast tier's 60 is
      # not the right budget for a run that is mostly collection.
      timeout-minutes: 15

  # Nightly: the heavy tier (`-m heavy`) the PR/push run skips.
  test-heavy:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-latest
      task_runner: task
      task: test-heavy
      # The venv tier is the slow one; _test.yml's default timeout is 60.
      timeout-minutes: 120

  # Nightly: the edit-loop selection again, in a shuffled order
  # (`task test-randomly`, pytest-randomly). The plugin is installed as a dev
  # dependency but disabled everywhere by addopts' `-p no:randomly`; this job
  # is the only place that re-enables it, so no other tier pays for the
  # reshuffle (TODO §27.4: conditional adopt, nightly seed job only). A fresh
  # random seed every run is the point: the header prints it for reproduction.
  test-randomly:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ubuntu-latest
      task_runner: task
      task: test-randomly

  docs:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/_docs.yml
    with:
      task_runner: task
    permissions:
      contents: write

  example:
    needs: test
    if: github.ref_name == 'main' && github.event_name != 'schedule'
    uses: ./.github/workflows/_example.yml
    secrets:
      EXAMPLE_DEPLOY_KEY: ${{ secrets.EXAMPLE_DEPLOY_KEY }}

  release:
    needs: [test, docs]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write

  required-checks-passed:
    name: all required checks passed
    # `changes` is in needs so a failure of the docs-only detector itself fails
    # the gate instead of silently skipping the jobs it guards; its success (and
    # any `skipped` test job on a docs-only PR) is tolerated by the jq below.
    needs: [changes, hygiene, lint, test, test-meta, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check all required jobs passed
        run: |
          failing=$(echo '${{ toJSON(needs) }}' | jq -r '
            to_entries[] |
            select(.value.result != "success" and .value.result != "skipped") |
            "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
