name: setup-runner
description: >-
  The shared environment setup of this template's reusable workflows: the
  package manager the lockfile selects (uv / pixi / poetry), and the task
  runner the caller drives (Task / Just). One definition, four callers
  (_tasks / _test / _docs / _dist), shipped to generated projects by symlink
  — the same content-identical-link rule as the workflows themselves.
  The checkout deliberately stays in each caller, not here: a local action's
  files must exist on disk before it can be invoked, so a composite that
  checks the repository out can never run (the caller fails resolving this
  file, with "Can't find 'action.yml' ... Did you forget to run
  actions/checkout before running your local action?").
inputs:
  task_runner:
    description: Which task runner to install (task, just). Empty installs neither.
    required: false
    default: ""
  uv_cache:
    description: >-
      setup-uv's enable-cache: "true" keeps the uv cache on tag-push runs
      too, "auto" (setup-uv's own default) disables it there.
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - name: Install uv
      if: hashFiles('pixi.lock', 'poetry.lock') == ''
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # Explicit true (not the "auto" default) so tag-push runs also
        # cache: "auto" disables caching on tag pushes. Callers choose.
        enable-cache: ${{ inputs.uv_cache }}

    - name: Install pixi
      if: hashFiles('pixi.lock') != ''
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        # Install the CLI only: projects keep pixi config in pyproject.toml
        # ([tool.pixi], except ros2+pixi which ships pixi.toml), and the
        # action's default post-install `pixi install` canonicalizes a
        # pixi.toml that usually does not exist. Environment creation stays
        # with the task definitions, which run in the project directory.
        run-install: false

    - name: Install poetry
      if: hashFiles('poetry.lock') != ''
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

    - name: Install Task # task-version: v3.46.4
      if: inputs.task_runner == 'task'
      # Direct binary install: arduino/setup-task is Node20-deprecated;
      # the pin is tracked by the weekly check-upstream drift report.
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/task-bin"
        curl -fsSL https://github.com/go-task/task/releases/download/v3.46.4/task_linux_amd64.tar.gz \
          | tar -xz -C "$RUNNER_TEMP/task-bin" task
        echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/task-bin/task" --version

    - name: Install Just
      if: inputs.task_runner == 'just'
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      with:
        # zizmor unpinned-tools: the just CLI version is pinned and
        # tracked by the weekly check-upstream drift report
        just-version: "1.58.0"
