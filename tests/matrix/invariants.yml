# What a render of the questionnaire must satisfy: one row per leaf class
# (TODO.md §26.4 item 4, §23.4 item 2). This file is the single source the
# witness generator, the witness runner's content predicates and the fast-path
# smoke test all read.
#
# A row answers three questions about the leaf class it selects:
#
#   ships / absent  the artifacts a render of that class must (not) contain.
#                   This is the `expect` of a §C6 batch request:
#                   tools/z3_witnesses.py builds tests/matrix/witnesses.jsonl
#                   from it and tests/test_witness_matrix.py's fast tier
#                   asserts it.
#   predicates      the content predicates that must hold on the render.
#                   One id per predicate, implemented in
#                   tests/test_render_invariants.py (that module owns the
#                   implementations and checks this registry matches them).
#   content         (path, substring) pairs that must appear in the render --
#                   the per-class content checks of
#                   tests/test_recommended_path.py.
#
#   markers         optional. The fast-path smoke test's branch tells: the
#                   artifacts that prove the render took THIS branch instead of
#                   a neighbouring one. `markers.ships` defaults to the row's
#                   `ships`, `markers.absent` to []. A tell is a different
#                   claim than `ships`/`absent` -- it is what distinguishes the
#                   branch -- so it may name an artifact the witness `ships`
#                   list does not (layout=data_science's de-identification
#                   guide) or an absence no witness `expect` declares.
#   tier            optional. The witness tier this class is CI-gated for,
#                   mirroring support.yml's tier_policy (the human-approved
#                   declaration; the `why` quotes its measured evidence).
#   why             why the row says what it says.
#
# A leaf's expectation is the ORDERED union of the rows its answers select:
# `ships`/`absent` concatenate in file order, so rows are listed base first --
# common layout, layout switches, project types, judges, opt-in layers, gates
# -- and tests/matrix/witnesses.jsonl's committed `expect` is exactly this
# union (tests/test_invariants.py pins that). A leaf's tier is the set of tiers
# its rows declare; the tier the witness ledger actually ran it at must be one
# of them, which is what keeps this column and that ledger from drifting.
# Every dimension value a leaf carries (project_type, oj_kind, an include
# layer, a gate turned off) must be selected by some row: tools/invariants.py
# reports the ones that are not, so a new question, layer or judge cannot be
# added without saying what it renders.
#
# `select` keys: project_type / oj_kind / include / gate_off (any-of lists of
# question names or choice values), plus the questionnaire's derived traits
# web_api, data_science, kaggle, src_layout (bools: a row selects the leaves
# where the trait holds). An empty `select` selects every leaf.
#
# Illustrative row:
#
#   - id: project_type=script
#     select: {project_type: [script], web_api: false}
#     ships: [smoke_example/__init__.py]
#     absent: []
#     predicates: [agents-md, docs-nav]
#     why: "the flat script layout: the package is a top-level module"
#
# (the real `project_type=script` row below carries its markers, content and
# tier as well).

version: 1

# Content predicates. The id is what a row's `predicates` list names; the
# implementation lives in tests/test_render_invariants.py, which fails if this
# registry and its own predicate table drift apart.
predicates:
  - id: pyproject
    why: "pyproject.toml parses, its [project] metadata is the answer set's, every third-party import is a declared dependency, and each feature's dependencies are declared exactly when its artifact is rendered"
  - id: agents-md
    why: "the AGENTS.md command table names the render's task runner and only tasks that runner defines"
  - id: readme-links
    why: "every relative README.md link resolves inside the render"
  - id: docs-nav
    why: "every zensical.toml / mkdocs.yml nav target exists in the render"
  - id: ethics-appendix
    why: "the AGENTS.md ethics appendix ships exactly the sections the render's project kind selects (license drift everywhere the guide ships; PQC on library/cli/web_api; AI-and-copyright on cli and the data-science layout; LLM/MCP security where mcp_effective holds; ML fairness on the data-science layout and kaggle; the scraping-law map where scraping_effective holds; contest rules on the oj_code judges), per _shared/ethics/REGISTRY.yml's active rows"

# Names the witness leaf space deliberately keeps out, one line of reason
# each (TODO.md §23.4: "enumerated" and "excluded" are both numbers). A
# `project_type` entry is a non-goal the questionnaire must not offer again --
# the generator subtracts it from the leaf domain and this file fails if the
# questionnaire offers it anyway. A `question` entry is a question the
# questionnaire still asks but the leaf space never varies: every witness leaf
# keeps it at its copier default. The generator refuses an include question
# that is neither a leaf-space layer nor declared here, so nothing can leave
# the enumeration silently.
# What each adopt-time merge kind promises about its outcome (TODO §25.5 V5).
# This is the oracle the merge-contract tests read (tests/test_merge_contracts.py,
# which owns the condition implementations and holds this registry against the
# dispatch in tools/file_merge.py / tools/pyproject_merge.py): a kind the code
# offers without a declared contract, a contract whose kind is gone, and a
# condition name no checker implements all fail. Conditions:
#   original_is_prefix  the adopter's pre-merge content is still a byte prefix
#   idempotent          applying the merge twice changes nothing
#   existing_declared   everything the target declared survives, unchanged
#   reparse             the merged file still parses in its own format
merges:
  gitignore: [original_is_prefix, idempotent, existing_declared]
  makefile: [original_is_prefix, idempotent, existing_declared]
  justfile: [original_is_prefix, idempotent, existing_declared]
  taskfile: [original_is_prefix, idempotent, existing_declared, reparse]
  python_tasks: [original_is_prefix, idempotent, existing_declared, reparse]
  ci_jobs: [original_is_prefix, idempotent, existing_declared, reparse]
  pyproject_dependencies: [idempotent, existing_declared, reparse]

excluded:
  - project_type: web_django
    why: "generation aborts by design: the _tasks.jinja web_django task exits 1"
  - question: include_sentry
    why: "an integration detail question behind use_recommended_integrations, not a leaf-space layer; every leaf keeps it at its default false"
  - question: oj_sample
    why: "an opt-in sample-check workflow behind oj_code, not a leaf-space dimension; every leaf keeps it at its default false and the per-site bodies are covered by tests/test_example_oj.py"

# One row per leaf class, in composition order (base first, override last).
leaf_classes:
  # -- the common layout -------------------------------------------------- #
  - id: common
    select: {}
    ships:
      - README.md
      - LICENSE
      - .gitignore
      - .editorconfig
      - pyproject.toml
      - Dockerfile
      - justfile
      - .github/workflows/ci.yml
      - .github/workflows/template-update.yml
      - CHANGELOG.md
      - .daimonion-manifest.yml
    absent:
      - "**/*.jinja"
    markers:
      # The common layout is not a branch tell: every class ships it.
      ships: []
    predicates: [pyproject, readme-links, ethics-appendix]
    why: "the layout every leaf ships, recommended gates or not; `absent` catches a branch that was copied verbatim instead of rendered"

  # -- layout switches ---------------------------------------------------- #
  - id: layout=data_science
    select: {data_science: true}
    ships:
      - notebooks/.gitkeep
      # Gated on data_science_layout, which defaults to this trait, so every
      # leaf this row selects renders it (previously only the fast-path
      # markers asserted it, so a disappearing guide was invisible to the 205
      # witness leaves).
      - data/DEIDENTIFICATION.md
    absent: []
    predicates: [agents-md, docs-nav]
    content:
      - [pyproject.toml, polars]
    why: "the data-science layout (notebooks/ data/ models/ reports/), from project_type=data_science or the include_data_science layer; it changes questions/_internal.yml's pkg_dir"

  - id: layout=web_api
    select: {web_api: true}
    ships:
      - app/main.py
      - ethics/regions.yml
    absent: []
    predicates: [agents-md, docs-nav]
    content:
      - [.github/workflows/ci.yml, postgres]
      - [pyproject.toml, fastapi]
      - [AGENTS.md, regions.yml]
    why: "the FastAPI scaffold: the app lives in a top-level app/ package, so this row (not the project type's) owns the package directory"

  - id: layout=no_src
    select: {data_science: false, kaggle: false, src_layout: false}
    ships: []
    absent:
      - src
    predicates: []
    why: "the src/ tree comes from the src layout, the web_api app, the kaggle workspace or the data-science layout -- and from nothing else"

  # -- project types ------------------------------------------------------ #
  - id: project_type=library
    select: {project_type: [library], web_api: false}
    ships:
      - src/smoke_example/__init__.py
    absent:
      - ethics/regions.yml
    markers:
      absent: [compose.local.yml, smoke_example/__init__.py]
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended library path, executed end to end (~3 min): uv sync + generated pytest + basedpyright + docs"
    why: "the src layout package; docker is off on the recommended path, so no compose file, and the flat script layout's module must not appear"

  - id: project_type=cli
    select: {project_type: [cli], web_api: false}
    ships:
      - src/smoke_example/__init__.py
    absent:
      - ethics/regions.yml
    markers:
      absent: [compose.local.yml, app/main.py]
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended CLI path, executed end to end (~3 min): console-script entry point and its CLI tests in the generated pytest run"
    why: "the src layout package behind a console script; the web_api app/ layout is the neighbouring branch this row tells apart"

  - id: project_type=script
    select: {project_type: [script], web_api: false}
    ships:
      - smoke_example/__init__.py
    absent:
      - ethics/regions.yml
    markers:
      absent: [src, compose.local.yml]
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended script path, executed end to end (~3 min): flat stdlib-style workspace, pytest + basedpyright + docs run"
    why: "the flat layout: the module is top-level and there is no src/ tree"

  - id: project_type=web_api
    select: {project_type: [web_api]}
    ships: []
    absent: []
    markers:
      absent: [compose.local.yml, src]
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended web-API path, executed end to end (~3 min): FastAPI + SQLAlchemy + Alembic stack, tests against SQLite"
    why: "the web_api project type ships no package directory of its own: layout=web_api owns app/main.py"

  - id: project_type=data_science
    select: {project_type: [data_science]}
    ships: []
    absent: []
    markers:
      # The analysis layout's own artifact; the layer (include_data_science)
      # ships notebooks/ but not the de-identification guide.
      ships: [data/DEIDENTIFICATION.md]
      absent: [compose.local.yml]
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended data-science path, executed end to end (~3 min): the torch dependency sync is the slowest leaf but still inside the sample"
    why: "the data_science project type ships no package directory of its own: layout=data_science owns the analysis layout"

  - id: project_type=online_judge
    select: {project_type: [online_judge]}
    ships: []
    absent: []
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "one online-judge leaf (competitive_coding/atcoder) is in the full-tier sample; the other judges render only (see the oj_kind rows)"
    why: "the judge-specific workspace is supplied by the oj_kind rows below; every judge now ships the agent guide, whose AI wording defers to the contest"

  - id: project_type=ros2
    select: {project_type: [ros2]}
    ships:
      - package.xml
      - smoke_example/__init__.py
    absent:
      - ethics/regions.yml
    predicates: [agents-md, docs-nav]
    tier:
      name: fast
      why: "render + ruff only: executing a ros2 leaf needs /opt/ros/$ROS_DISTRO on the runner"
    why: "an ament_python package: package.xml plus the node module, never a src/ layout. The agent guide ships since 2026-09-21 (all types do); PKI-chain's audience is iot/cli/web, not ros2"

  - id: project_type=micropython
    select: {project_type: [micropython]}
    ships:
      - firmware/main.py
    absent:
      - ethics/regions.yml
    predicates: [agents-md, docs-nav]
    tier:
      name: full
      why: "recommended MicroPython path, executed end to end (~3 min): generated type checks pass against the micropython-*-stubs"
    why: "the firmware layout: firmware/ instead of a Python package. The agent guide ships since 2026-09-21, and micropython is the registry's `iot` audience for PKI-chain"

  # -- online judges ------------------------------------------------------ #
  - id: oj_kind=kaggle
    select: {project_type: [online_judge], oj_kind: [kaggle]}
    ships:
      - src/utils/__init__.py
    absent:
      - src/smoke_example
      - challenges
    markers:
      absent: [compose.local.yml, src/smoke_example/__init__.py, challenges]
    predicates: [agents-md]
    content:
      - [pyproject.toml, torch]
    tier:
      name: fast
      why: "AtCoder carries the execution sample; kaggle is render-only"
    why: "a competition workspace: src/utils/ with the pipeline, no package under src/smoke_example and no CTF challenges"

  - id: oj_kind=ctf
    select: {project_type: [online_judge], oj_kind: [ctf]}
    ships:
      - challenges/pwn/example/solve.py
      - AGENTS.md
    absent:
      - ethics/regions.yml
    markers:
      absent: [compose.local.yml, src/smoke_example/__init__.py]
    predicates: [agents-md]
    content:
      - [pyproject.toml, pwntools]
    tier:
      name: fast
      why: "AtCoder carries the execution sample; the CTF judge is render-only"
    why: "the CTF participant workspace plus the agent guide (kaggle and ctf always allow AI coding agents)"

  - id: oj_kind=code
    select: {project_type: [online_judge], oj_kind: [atcoder, leetcode, yukicoder, aoj, codeforces, kattis, other]}
    ships:
      - AGENTS.md
    absent:
      - src
      - ethics/regions.yml
    markers:
      # The bare workspace: README.md and the agent guide are all a
      # code-submission leaf ships beyond the common layout.
      ships: [README.md, AGENTS.md]
      absent: [src, challenges]
    predicates: [agents-md]
    content:
      - [pyproject.toml, "dependencies = []"]
    tier:
      name: fast
      why: "AtCoder carries the execution sample; leetcode / yukicoder / aoj / codeforces / kattis / other are render-only"
    why: "competitive-programming judges ship a bare workspace: no package and no challenges. The agent guide ships since 2026-09-21; its AI wording defers to the contest (oj_allow_ai picks the sentence where it was asked, the check-the-rules wording where it was not), and the contest-rules ethics section renders on this leaf (gated on oj_code)"

  # -- opt-in layers ------------------------------------------------------ #
  - id: include=include_data_science
    select: {include: [include_data_science]}
    ships: []
    absent: []
    predicates: []
    tier:
      name: fast
      why: "the layer renders and ruff-checks in the fast tier; the analysis layout it turns on is layout=data_science's row"
    why: "this layer answers has_data_science; the artifacts are layout=data_science's"

  - id: include=include_web_api
    select: {include: [include_web_api]}
    ships: []
    absent: []
    predicates: []
    tier:
      name: fast
      why: "the layer renders and ruff-checks in the fast tier; the app layout it turns on is layout=web_api's row"
    why: "this layer answers has_web_api; the artifacts are layout=web_api's"

  - id: include=include_ctf
    select: {include: [include_ctf]}
    ships:
      - challenges/pwn/example/solve.py
    absent: []
    predicates: []
    content:
      - [pyproject.toml, pwntools]
    tier:
      name: fast
      why: "the opt-in layers (ctf / data_science / scraping / web_api) are coverable by rendering: their artifacts are file-set invariants"
    why: "the CTF participant workspace on top of a library/cli base"

  - id: include=include_scraping
    select: {include: [include_scraping]}
    ships:
      - src/smoke_example/fetcher.py
      - tests/test_scraping.py
      - CHARTER.md
      - LEGAL.md
    absent: []
    predicates: []
    tier:
      name: fast
      why: "the opt-in layers (ctf / data_science / scraping / web_api) are coverable by rendering: their artifacts are file-set invariants"
    why: "the polite-fetching layer as a module plus its offline test, the data-collection charter, and the pre-crawl legal checklist (the scraping-law ethics section renders in AGENTS.md on this leaf, gated on scraping_effective)"

  - id: include=include_mcp
    # src/flat placements only: a web_api base carries the scaffold at the
    # fixed app/ path, claimed by gate_off=...integrations/details-chosen.
    select: {include: [include_mcp], web_api: false}
    ships:
      - src/smoke_example/mcp_server.py
      - tests/test_mcp_server.py
    absent: []
    predicates: []
    content:
      - [pyproject.toml, mcp]
    why: "the MCP server integration at the src/flat placement; a detail question behind use_recommended_integrations, so the web_api placement is claimed by gate_off=use_recommended_integrations/details-chosen and this row declares no tier"

  - id: include=include_bot
    # The default (recommended) platform: bot_platform keeps its copier
    # default on every leaf that does not answer it, and the derived
    # bot-platform variants (the six rows below) claim the others.
    select: {include: [include_bot], project_type: [cli], web_api: false, bot_platform: [discord]}
    ships:
      - src/smoke_example/bot_discord.py
      - tests/test_bot_discord.py
    absent:
      - src/smoke_example/bot_slack.py
      - src/smoke_example/bot_line.py
      - src/smoke_example/bot_gmail.py
      - tests/test_bot_slack.py
      - tests/test_bot_line.py
      - tests/test_bot_gmail.py
    predicates: []
    content:
      - [pyproject.toml, discord.py]
    tier:
      name: fast
      why: "the layer renders and ruff-checks in the fast tier; its real execution (build_bot()'s /ping callback in-process, no Gateway) is tests/test_bot_layer.py's heavy case"
    why: "the Discord bot layer on a cli base: the module rides the src-layout package with its own bot-discord console script"

  - id: include=include_bot_web_api
    select: {include: [include_bot], web_api: true, bot_platform: [discord]}
    ships:
      - app/bot_discord.py
      - tests/test_bot_discord.py
    absent:
      - app/bot_slack.py
      - app/bot_line.py
      - app/bot_gmail.py
      - tests/test_bot_slack.py
      - tests/test_bot_line.py
      - tests/test_bot_gmail.py
    predicates: []
    content:
      - [pyproject.toml, discord.py]
    tier:
      name: fast
      why: "the layer renders and ruff-checks in the fast tier; the cli-base row above carries the execution story for the shared scaffold"
    why: "the Discord bot layer on a web_api base: the module lives in the top-level app/ package beside the MCP server"

  # -- bot platforms chosen (the derived variants: gate off + platform) --- #
  # One row per generated platform the base leaves do not carry. The leaf
  # space derives them (tools/z3_witnesses.py BOT_PLATFORM_VARIANTS) so the
  # nightly rehearsal and the render sweep cover every generated platform,
  # not just the recommended one.
  - id: include=include_bot/bot_platform=slack
