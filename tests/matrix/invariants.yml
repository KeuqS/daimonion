    tier:
      name: fast
      why: "the custom platform renders and ruff-checks in the fast tier; its real execution (a recording slack_bolt.App, /app_mention in-process) is tests/test_bot_layer.py's heavy case"
    why: "No + bot_platform=slack on a cli base: the module rides the src-layout package with its own bot-slack console script and the slack-bolt dependency"

