    ships: []
    absent: []
    predicates: []
    tier:
      name: fast
      why: "project_type=*/gate=off:use_recommended_* (detailed branches) are rendered and ruff-checked; the 3 m/leaf execution cost limits the full tier to the sample"
    why: "every other gate-off branch leaves its detail questions at their copier defaults, so it changes no declared artifact (bot_platform keeps its discord default)"

  # -- the domain traits -------------------------------------------------- #
  #
  # A `domain_traits` answer adds no artifact and changes no layout: it
  # selects ethics sections in AGENTS.md and, for face-recognition, a
  # dependency. So these rows declare no `ships`/`absent` (what they add is
  # content inside an artifact another row owns) and their tier is `fast` --
  # the section's presence is the `ethics-appendix` predicate's business, and
  # nothing about it needs a venv. `domain` is a select key like `include`:
  # a leaf carrying several traits matches every row that names any of them,
  # which is what makes the co-occurrence leaf (`domain: [face-recognition,
  # medtech]`) select both rows and be held to both.
  - id: domain=personal-data
    select: {domain: [personal-data]}
    ships: []
    absent: []
    predicates: [ethics-appendix]
    tier:
      name: fast
      why: "render + ruff: the trait adds an ethics section, no artifact of its own (support.yml tier_policy)"
    why: "the personal-data domain trait: AGENTS.md gains the privacy section (minimise what you collect and log, give deletion a path, know what leaves the process). Biometric and health data are special categories of personal data, so the face-recognition and medtech traits select this row too -- the AGENTS.md gate spells that disjunction and the ethics-appendix predicate mirrors it."

  - id: domain=face-recognition
    select: {domain: [face-recognition, personal-data]}
    ships: []
    absent: []
    predicates: [ethics-appendix]
    tier:
      name: fast
      why: "render + ruff: the trait adds an ethics section and a dependency, no artifact of its own (support.yml tier_policy)"
    why: "the face-recognition domain trait: AGENTS.md gains the biometric-identification section (confirm the use is lawful, store templates irreversibly, measure per-group error rates), plus the privacy section, since biometric data is a special category of personal data."

  - id: domain=medtech
    select: {domain: [medtech, personal-data]}
    ships: []
    absent: []
    predicates: [ethics-appendix]
    tier:
      name: fast
      why: "render + ruff: the trait adds an ethics section and, only where the data-science layout holds, the CARE sheet"
    why: "the medtech domain trait: AGENTS.md gains the medical-SaMD section, plus the privacy section (health data is a special category). questions/_internal.yml's `care` takes the trait as a second trigger but keeps the `data_science_layout` conjunct, so a clinical web service gets the sections and no data/ sheet."

  # -- the distribution answers ------------------------------------------- #
  #
  # Like the domain traits, `distribution` is a derived axis: the projection
  # keeps it at its default (`in-house`), and the variants in
  # tools/z3_witnesses.py vary it. What it changes is one section -- the EU
  # CRA duties on `commercial` -- and nothing else, so these rows declare no
  # artifacts and carry the `ethics-appendix` predicate.
  - id: distribution=commercial
    select: {}
    ships: []
    absent: []
    predicates: [ethics-appendix]
    tier:
      name: fast
      why: "render + ruff: the answer adds an ethics section, no artifact of its own (support.yml tier_policy)"
    why: "the `commercial` distribution answer: AGENTS.md gains the EU CRA section (24-hour vulnerability reporting, SBOM, an explicit support period). Monetisation is what lifts the regulation's free-software exemption, which is why the section is gated on this answer rather than on the project type."

  - id: distribution=oss
    select: {}
    ships: []
    absent: []
    predicates: []
    tier:
      name: fast
      why: "render + ruff: publishing the source without selling it changes no declared artifact"
    why: "the `oss` answer on its own adds no section. That is the regulation's own line, not an omission: EU 2024/2847 art. 24 exempts free software while it is non-commercial, so an open repository owes no CRA duties until it is monetised -- the `commercial+oss` variant is where both apply."
